version: '3'

vars:
  BINARY: pcc
  VERSION: 0.1.0
  MODULE: github.com/seomini/pc_cleaner
  LDFLAGS: '-ldflags "-X main.version={{.VERSION}}"'
  INSTALL_DIR: /usr/local/bin

tasks:
  default:
    cmds:
      - task: build

  # ── 빌드 ──────────────────────────────────────────────────────
  build:
    desc: 바이너리 빌드
    cmds:
      - go build {{.LDFLAGS}} -o {{.BINARY}}{{exeExt}} .

  # ── 크로스컴파일 ───────────────────────────────────────────────
  build-all:
    desc: 전체 플랫폼 크로스컴파일 → bin/
    cmds:
      - GOOS=darwin  GOARCH=amd64 go build {{.LDFLAGS}} -o bin/{{.BINARY}}_darwin_amd64 .
      - GOOS=darwin  GOARCH=arm64 go build {{.LDFLAGS}} -o bin/{{.BINARY}}_darwin_arm64 .
      - GOOS=linux   GOARCH=amd64 go build {{.LDFLAGS}} -o bin/{{.BINARY}}_linux_amd64 .
      - GOOS=windows GOARCH=amd64 go build {{.LDFLAGS}} -o bin/{{.BINARY}}_windows_amd64.exe .
      - echo "✓ 전체 빌드 완료 → bin/"

  # ── 클린 ──────────────────────────────────────────────────────
  clean:
    desc: 빌드 산출물 삭제
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Force -ErrorAction SilentlyContinue '{{.BINARY}}.exe'; Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'bin'; exit 0"
        platforms: [windows]
      - cmd: rm -f {{.BINARY}} {{.BINARY}}.exe && rm -rf bin/
        platforms: [linux, darwin]
      - echo "✓ 빌드 산출물 삭제 완료"

  # ── 실행 (dry-run) ────────────────────────────────────────────
  run:
    desc: 빌드 후 dry-run 실행
    deps: [build]
    cmds:
      - ./{{.BINARY}}{{exeExt}} --dry-run

  # ── 테스트 ────────────────────────────────────────────────────
  test:
    desc: 유닛 테스트 실행
    cmds:
      - go test ./... -v

  # ── 설치 (/usr/local/bin, Unix 전용) ──────────────────────────
  install:
    desc: /usr/local/bin 에 설치 (macOS/Linux 전용)
    deps: [build]
    platforms: [linux, darwin]
    cmds:
      - install -m 755 {{.BINARY}} {{.INSTALL_DIR}}/{{.BINARY}}
      - echo "✓ 설치 완료:{{" "}}{{.INSTALL_DIR}}/{{.BINARY}}"

  # ── 설치 삭제 (Unix 전용) ─────────────────────────────────────
  uninstall:
    desc: 설치된 바이너리 삭제 (macOS/Linux 전용)
    platforms: [linux, darwin]
    cmds:
      - rm -f {{.INSTALL_DIR}}/{{.BINARY}}
      - echo "✓ 삭제 완료:{{" "}}{{.INSTALL_DIR}}/{{.BINARY}}"
