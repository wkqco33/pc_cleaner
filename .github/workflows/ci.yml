name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt required on the following files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go build and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Unit tests
        run: go test ./... -v

      - name: Coverage gate (core packages ≥ 70%)
        run: |
          go test ./internal/scanner ./internal/cleaner -coverprofile=/tmp/core.out
          total=$(go tool cover -func=/tmp/core.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Core package coverage: ${total}%"
          if awk "BEGIN {exit (${total} < 70.0)}"; then
            echo "✓ Core coverage OK: ${total}%"
          else
            echo "::error::Core coverage below 70% threshold (got ${total}%)"
            exit 1
          fi

  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-compile check
        run: |
          set -euo pipefail
          for target in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "== ${os}/${arch} =="
            GOOS="${os}" GOARCH="${arch}" go build -o /dev/null .
          done
